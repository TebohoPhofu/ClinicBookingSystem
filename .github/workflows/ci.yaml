name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: ClinicBookingSystem.slnx
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ------------------------------------------------------------------
  # Build the whole solution, then run unit + integration tests.
  # Integration tests use Testcontainers, so Docker is required —
  # ubuntu-24.04 ships it out of the box.
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            *.slnx
            Directory.Packages.props
            Directory.Build.props

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test
          ClinicBookingSystem.UnitTests/ClinicBookingSystem.UnitTests.csproj
          --configuration Release --no-build

      - name: Integration tests (Testcontainers + SQL Server)
        run: >
          dotnet test
          ClinicBookingSystem.IntegrationTests/ClinicBookingSystem.IntegrationTests.csproj
          --configuration Release --no-build

  # ------------------------------------------------------------------
  # Build both Dockerfiles and push to GitHub Container Registry.
  # Only runs on pushes to master so forks/PRs never touch the registry.
  # ------------------------------------------------------------------
  docker-publish:
    name: Publish Docker images
    runs-on: ubuntu-24.04
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR requires lowercase image names; github.repository preserves case.
      - name: Set lowercase image names
        run: |
          echo "IMAGE_API=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
          echo "IMAGE_WEB=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web