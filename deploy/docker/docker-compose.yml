# Local stack: SQL Server + API + Blazor UI. No setup needed, from the repository root run:
#   docker compose -f deploy/docker/docker-compose.yml up --build
# UI: http://localhost:5271   API + Swagger: http://localhost:5100/swagger
# API settings live in ClinicBookingSystem.Api/appsettings.Docker.json (local-only values; never reuse them in production).
name: clinic-booking

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Clinic#Local123 # must match the connection string in appsettings.Docker.json
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    # The first start of a fresh volume upgrades the system databases, which can take 10+ minutes on slow disks.
    # Failures during start_period do not count, so later restarts are quick and a hung server is still detected.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 15m

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5100:8080"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "5271:80"

volumes:
  sql-data:
